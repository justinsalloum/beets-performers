[metadata]
name = beets-performers
version = 0.1.0
description = Beets plugin to use performer information from MusicBrainz as artist tags
long_description = file: README.md
long_description_content_type = text/markdown
author = Beets Community
url = https://github.com/justinsalloum/beets-performers
license = MIT
classifiers =
    Topic :: Multimedia :: Sound/Audio
    Topic :: Multimedia :: Sound/Audio :: Players :: MP3
    License :: OSI Approved :: MIT License
    Environment :: Console
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find_namespace:
install_requires =
    beets>=1.6.0
    musicbrainzngs>=0.7.1
python_requires = >=3.8

[options.packages.find]
include = beetsplug*

[options.extras_require]
test =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    coverage>=6.0

[tool:pytest]
testpaths = test
python_files = test_*.py
python_classes = *Test
python_functions = test_*

[coverage:run]
source = beetsplug
omit =
    test/*
    beetsplug/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
show_missing = True

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,.eggs
