[pytest]
testpaths = test
python_files = test_*.py
python_classes = *Test
python_functions = test_*
addopts =
    -v
    --cov=beetsplug.performers
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
