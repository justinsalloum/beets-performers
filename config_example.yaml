# Example beets configuration with performers plugin
# Copy the performers section to your ~/.config/beets/config.yaml file

plugins: performers musicbrainz

# MusicBrainz plugin configuration (required for performers to work)
musicbrainz:
  # Enable to get extra relationships data
  extra_tags: [year, catalognum, country, media, label]

# Performers plugin configuration
performers:
  # Enable/disable the plugin
  use_performers: true

  # Always include vocal performers
  always_include_vocals: true

  # Include instrumental performers
  include_instruments: false

  # Only use vocal performers (ignore instruments)
  # Set to true for musicals/soundtracks, false for classical/jazz
  vocals_only: false

  # Specific instrument roles to include (empty = all instruments if include_instruments is true)
  # Common examples: guitar, piano, drums, bass, violin, cello, trumpet, saxophone
  instrument_roles: []

  # Fall back to artist-credit if no performers found
  # Recommended: true (otherwise tracks without performer data will have no artist)
  fallback_to_artist_credit: true

  # Prefer vocal performers over instrumental (when both exist)
  # If true and vocals are found, instrumentalists are excluded
  prefer_vocals: true

  # Separator for multiple artists
  # Examples: ', ' (comma-space), ' & ' (ampersand), '; ' (semicolon)
  separator: ', '

  # Maximum number of artists to include (0 = no limit)
  # Useful when tracks have many performers (e.g., orchestras)
  max_artists: 0

# Example configurations for different use cases:

# ----------------------------------------
# Use Case 1: Musicals & Soundtracks
# Goal: Tag with vocalists only
# ----------------------------------------
# performers:
