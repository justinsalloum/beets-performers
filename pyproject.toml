[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "beets-performers"
version = "0.1.0"
description = "A beets plugin to use performer information from MusicBrainz as artist tags"
authors = ["Beets Community"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/justinsalloum/beets-performers"
repository = "https://github.com/justinsalloum/beets-performers"
keywords = ["beets", "plugin", "music", "metadata", "performers", "musicbrainz"]
packages = [{include = "beetsplug"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

[tool.poetry.dependencies]
python = "^3.9"
beets = ">=1.6.0"
musicbrainzngs = ">=0.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
poethepoet = "^0.24.0"

[tool.poe.tasks]
test = "pytest -v"
test-with-coverage = "pytest --cov=beetsplug.performers --cov-report=html --cov-report=term -v"
lint = "ruff check beetsplug test"
format = "ruff format beetsplug test"
format-check = "ruff format --check beetsplug test"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["beetsplug"]
omit = ["*/test/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
